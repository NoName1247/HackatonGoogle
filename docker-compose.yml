services:
  nginx:
    image: nginx:1.26-alpine
    container_name: horizon-nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - frontend
    mem_limit: 96m
    cpus: 0.30
    oom_score_adj: 500
    networks:
      - edge_net
      - app_net
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: horizon-relay-frontend:latest
    container_name: horizon-frontend
    environment:
      - NODE_ENV=production
      - NODE_OPTIONS=--max-old-space-size=256
      - NEXT_PUBLIC_API_URL=/api/v1
    mem_limit: 384m
    cpus: 0.40
    oom_score_adj: 500
    networks:
      - app_net
    restart: unless-stopped

  # Образ horizon-relay-backend:latest собирается ОДИН РАЗ здесь, а все 5 воркеров ниже переиспользуют его!
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: horizon-relay-backend:latest
    container_name: horizon-api
    command: >
      uvicorn main_api:app
      --host 0.0.0.0
      --port 8000
      --workers 1
      --loop uvloop
      --http httptools
    env_file:
      - .env.example
    volumes:
      - ./backend:/app
      - horizon_blobs:/var/lib/horizon/blobs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    mem_limit: 512m
    cpus: 0.75
    oom_score_adj: 500
    networks:
      - app_net
      - data_net
      - egress_net
    restart: unless-stopped

  worker-parser:
    image: horizon-relay-backend:latest
    container_name: horizon-worker-parser
    command: >
      celery -A workers.worker_parser worker
      -Q q_parser
      --pool=prefork
      --concurrency=1
      --max-tasks-per-child=50
      --loglevel=INFO
    env_file:
      - .env.example
    volumes:
      - ./backend:/app
      - horizon_blobs:/var/lib/horizon/blobs
    depends_on:
      - api
    mem_limit: 512m
    cpus: 0.50
    oom_score_adj: 600
    networks:
      - data_net
    restart: unless-stopped

  worker-probe:
    image: horizon-relay-backend:latest
    container_name: horizon-worker-probe
    command: >
      celery -A workers.worker_probe worker
      -Q q_probe
      --pool=threads
      --concurrency=4
      --loglevel=INFO
    env_file:
      - .env.example
    depends_on:
      - api
    mem_limit: 256m
    cpus: 0.30
    oom_score_adj: 600
    networks:
      - data_net
      - egress_net
    restart: unless-stopped

  worker-auditor:
    image: horizon-relay-backend:latest
    container_name: horizon-worker-auditor
    command: >
      celery -A workers.worker_auditor worker
      -Q q_auditor
      --pool=threads
      --concurrency=4
      --loglevel=INFO
    env_file:
      - .env.example
    volumes:
      - ./backend:/app
      - horizon_blobs:/var/lib/horizon/blobs
    depends_on:
      - api
    mem_limit: 384m
    cpus: 0.50
    oom_score_adj: 600
    networks:
      - data_net
      - egress_net
    restart: unless-stopped

  worker-synergy:
    image: horizon-relay-backend:latest
    container_name: horizon-worker-synergy
    command: >
      celery -A workers.worker_synergy worker
      -Q q_synergy
      --pool=threads
      --concurrency=2
      --loglevel=INFO
    env_file:
      - .env.example
    depends_on:
      - api
    mem_limit: 1536m
    cpus: 0.80
    oom_score_adj: 600
    networks:
      - data_net
      - egress_net
    restart: unless-stopped

  worker-cron:
    image: horizon-relay-backend:latest
    container_name: horizon-worker-cron
    command: >
      celery -A workers.worker_cron worker
      -Q q_cron
      --pool=solo
      --beat
      --loglevel=INFO
    env_file:
      - .env.example
    depends_on:
      - api
    mem_limit: 384m
    cpus: 0.30
    oom_score_adj: 600
    networks:
      - data_net
      - egress_net
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: horizon-postgres
    environment:
      POSTGRES_USER: horizon
      POSTGRES_PASSWORD: horizon_secure_pwd
      POSTGRES_DB: horizon_relay
    command: >
      postgres
      -c max_connections=100
      -c shared_buffers=128MB
      -c effective_cache_size=384MB
      -c work_mem=8MB
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U horizon -d horizon_relay"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 512m
    cpus: 0.50
    oom_score_adj: 500
    networks:
      - data_net
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.12.1
    container_name: horizon-qdrant
    volumes:
      - qdrant_data:/qdrant/storage
    mem_limit: 512m
    cpus: 0.40
    oom_score_adj: 500
    networks:
      - data_net
    restart: unless-stopped

  redis:
    image: redis:7.2-alpine
    container_name: horizon-redis
    command: >
      redis-server
      --maxmemory 128mb
      --maxmemory-policy volatile-lfu
      --appendonly yes
      --appendfsync everysec
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 192m
    cpus: 0.20
    oom_score_adj: 500
    networks:
      - data_net
    restart: unless-stopped

volumes:
  postgres_data:
  qdrant_data:
  redis_data:
  horizon_blobs:

networks:
  edge_net:
  app_net:
  data_net:
  egress_net:
