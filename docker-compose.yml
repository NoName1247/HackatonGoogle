services:
  nginx:
    image: nginx:1.26-alpine
    container_name: horizon-nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - frontend
    mem_limit: 64m
    oom_score_adj: 500
    networks:
      - edge_net
      - app_net
    restart: unless-stopped

  frontend:
    image: horizon-relay-frontend:latest
    container_name: horizon-frontend
    environment:
      - NODE_ENV=production
      - NODE_OPTIONS=--max-old-space-size=160
      - NEXT_PUBLIC_API_URL=/api/v1
    mem_limit: 220m
    oom_score_adj: 500
    networks:
      - app_net
    restart: unless-stopped

  api:
    image: horizon-relay-backend:latest
    container_name: horizon-api
    command: >
      uvicorn main_api:app
      --host 0.0.0.0
      --port 8000
      --workers 1
      --loop uvloop
      --http httptools
    env_file:
      - .env
    volumes:
      - ./backend:/app
      - horizon_blobs:/var/lib/horizon/blobs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    mem_limit: 320m
    oom_score_adj: 500
    networks:
      - app_net
      - data_net
      - egress_net
    restart: unless-stopped

  # Единый многопоточный воркер, обслуживающий все 5 очередей в одном процессе (экономит 800 МБ RAM!)
  worker-unified:
    image: horizon-relay-backend:latest
    container_name: horizon-worker-unified
    command: >
      celery -A workers.celery_app worker
      -I workers.worker_parser,workers.worker_probe,workers.worker_auditor,workers.worker_synergy,workers.worker_cron
      -Q q_parser,q_probe,q_auditor,q_synergy,q_cron
      --pool=threads
      --concurrency=6
      --loglevel=INFO
    env_file:
      - .env
    volumes:
      - ./backend:/app
      - horizon_blobs:/var/lib/horizon/blobs
    depends_on:
      - api
    mem_limit: 380m
    oom_score_adj: 600
    networks:
      - data_net
      - egress_net
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: horizon-postgres
    environment:
      POSTGRES_USER: horizon
      POSTGRES_PASSWORD: horizon_secure_pwd
      POSTGRES_DB: horizon_relay
    command: >
      postgres
      -c max_connections=60
      -c shared_buffers=64MB
      -c effective_cache_size=192MB
      -c work_mem=4MB
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U horizon -d horizon_relay"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 220m
    oom_score_adj: 500
    networks:
      - data_net
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.12.1
    container_name: horizon-qdrant
    volumes:
      - qdrant_data:/qdrant/storage
    mem_limit: 220m
    oom_score_adj: 500
    networks:
      - data_net
    restart: unless-stopped

  redis:
    image: redis:7.2-alpine
    container_name: horizon-redis
    command: >
      redis-server
      --maxmemory 64mb
      --maxmemory-policy volatile-lfu
      --save ""
      --appendonly no
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 96m
    oom_score_adj: 500
    networks:
      - data_net
    restart: unless-stopped

volumes:
  postgres_data:
  qdrant_data:
  redis_data:
  horizon_blobs:

networks:
  edge_net:
  app_net:
  data_net:
  egress_net:
