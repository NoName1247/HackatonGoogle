[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "horizon-relay-backend"
version = "2.0.0"
description = "Horizon Relay: Zero-Trust Academic Thesis Audit & Asymmetric R&D Synergy Engine"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.2",
    "pydantic-settings>=2.6.0",
    "orjson>=3.10.10",
    "python-multipart>=0.0.12",
    "sse-starlette>=2.1.3",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "redis>=5.2.0",
    "celery>=5.4.0",
    "qdrant-client>=1.12.1",
    "pymupdf>=1.24.13",
    "pymupdf4llm>=0.0.17",
    "rapidocr-onnxruntime>=1.3.24",
    "onnxruntime>=1.20.0",
    "fastembed>=0.4.1",
    "litellm>=1.52.0",
    "httpx>=0.27.2",
    "tenacity>=9.0.0",
    "cachetools>=5.5.0",
    "ijson>=3.3.0",
    "zstandard>=0.23.0",
    "jinja2>=3.1.4",
    "numpy>=1.26.4",
    "scikit-learn>=1.5.2",
]

[tool.setuptools]
py-modules = ["config_and_db", "models_and_schemas", "main_api"]
packages = ["core", "workers"]
